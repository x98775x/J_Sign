[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.partitions = huge_app.csv      ; WiFi + MP3 decoder do not fit the default 1.3 MB app slot
lib_ldf_mode = chain+

monitor_filters = send_on_enter
monitor_echo = yes
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    earlephilhower/ESP8266Audio@^1.9.7

build_flags =
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_ESP32_DEV
