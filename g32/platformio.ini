[env:gd32f205]
platform = ststm32
; GD32F205VCT6 is pin/peripheral compatible with STM32F205VCT6 -
; using the closest matching generic board definition.
board = genericSTM32F205VC
framework = arduino

monitor_speed = 115200
upload_protocol = stlink

lib_deps =
    lvgl/lvgl@^8.3.0

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
