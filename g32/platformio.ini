[env:gd32f205]
platform = ststm32
; No PlatformIO-packaged board exists for this chip. The stm32duino Arduino
; core DOES support it as an auto-generated generic entry (GENERIC_F205VCTX
; in their boards.txt), but PlatformIO's own board manifest list doesn't
; include it - so we ship our own custom board JSON instead of forcing an
; unrelated board (that approach caused HAL header mismatches - UID_BASE
; undeclared, etc, because the framework still thought it was an F407).
;
; See ./boards/gd32f205vct6.json - PlatformIO auto-detects board JSON files
; placed in a project's own /boards folder.
board = gd32f205vct6
framework = arduino

monitor_speed = 115200
upload_protocol = stlink

lib_deps =
    lvgl/lvgl@^8.3.0

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
